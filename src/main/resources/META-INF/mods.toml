modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/YiRanMushroom/GTMQoL/issues"

[[mods]]
modId = "gtmqol"
version = "${version}"
displayName = "${mod_name}"
displayURL = "${mod_url}"
authors = "${mod_author}"
description = '''
Quality-of-life addon for GregTech CEu Modern: wireless energy, steam and data, AE2 crafting machines and ME parts,
extra multiblocks, an overclocking overhaul, and other mods' recipes on GT machines.
'''

[[dependencies.gtmqol]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.gtmqol]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.gtmqol]]
modId = "gtceu"
mandatory = true
versionRange = "[${gtceu_min_version},)"
ordering = "AFTER"
side = "BOTH"
