plugins {
    id 'java-library'
    id 'maven-publish'
    // Same plugin and version as gtceu's 1.21 branch and its 1.21.1 addon template.
    id 'net.neoforged.moddev' version '2.0.141'
    // Applies META-INF/accesstransformer.cfg to compileOnly dependencies (accessCompileOnly), compile time only.
    id 'dev.vfyjxf.modaccessor' version '1.2.1'
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

// Jar names: gtmqol-<mod version>-<mc version>.jar. project.version stays plain, it goes into neoforge.mods.toml.
tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.mod_version}-${project.minecraft_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
    }
}

neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings
    }

    runs {
        client {
            client()
            programArguments.addAll('--width', '1280', '--height', '720')
            gameDirectory = file('run')
        }
        server {
            server()
            gameDirectory = file('run')
        }
        data {
            data()
            gameDirectory = file('run/data')
            programArguments.addAll('--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath,
                    '--existing-mod', 'gtceu')
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Our AT is for other mods' private classes (see META-INF/accesstransformer.cfg). ModDevGradle only applies it to
// Minecraft, so ModAccessor patches the jars on accessCompileOnly for javac; at runtime NeoForge applies the AT.
modAccessor {
    createTransformConfiguration(configurations.compileOnly)
    accessTransformerFiles = project.files('src/main/resources/META-INF/accesstransformer.cfg')
}

configurations {
    // Mods only in the dev runs, never a dependency of ours (MDG has no modLocalRuntime).
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'brachy.modularui'
        }
    }
    maven {
        // Registrate for 1.21 is only published here
        name = 'devOS'
        url = 'https://mvn.devos.one/snapshots/'
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
        content {
            includeGroup 'dev.emi'
        }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'org.appliedenergistics'
            includeGroup 'mekanism'
        }
    }
    maven {
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        // KubeJS's gif library is only published here
        name = 'JitPack'
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.rtyley'
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'Toma'
        url = 'https://repo.repsy.io/mvn/toma/public/'
        content {
            includeGroup 'dev.toma.configuration'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content {
            includeGroup 'dev.ftb.mods'
        }
    }
}

dependencies {
    // Same setup as gtceu's 1.21.1 addon template: gtceu without its pom dependencies, and the libraries it
    // jar-in-jars declared by hand (Registrate and ModularUI are also in gtceu's public API). NeoForge runs
    // on Mojang names, so nothing is remapped and the jars stay as published.
    implementation("com.gregtechceu.gtceu:gtceu-${project.minecraft_version}:${project.gtceu_version}") {
        transitive = false
    }
    implementation "com.tterrag.registrate:Registrate:${project.registrate_version}"
    // Also our own config library (see GTMQoLConfig).
    implementation("dev.toma.configuration:configuration-${project.minecraft_version}:${project.configuration_version}") {
        transitive = false
    }
    implementation "brachy.modularui:modularui-mc${project.minecraft_version}:${project.modularui_version}"
    // ModularUI registers test items in dev, one of which implements a Curios interface (as on 1.20.1).
    // gtceu's own dev setup has it as localRuntime too.
    localRuntime "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"

    // Dev-only mods so the test client has recipe viewing, ME networks and KubeJS (GTCEu's optional deps).
    // Compile-only for mixin/gtceufix/EmiCallWrapperMixin, which only runs when EMI is loaded.
    compileOnly "dev.emi:emi-neoforge:${project.emi_version}"
    localRuntime "dev.emi:emi-neoforge:${project.emi_version}"
    localRuntime "dev.latvian.mods:kubejs-neoforge:${project.kubejs_version}"
    // Compile-only for recipedb/PatternBufferIngredients (gtceu's pattern buffer implements AE2 interfaces);
    // only used when AE2 is loaded, still not a runtime dependency of ours.
    accessCompileOnly "org.appliedenergistics:appliedenergistics2:${project.ae2_version}"
    localRuntime "org.appliedenergistics:appliedenergistics2:${project.ae2_version}"
    // Optional: ExtendedAE Plus smart doubling on gtceu's pattern buffer. Compile against its API, never
    // require it. It requires ExtendedAE, which in turn requires GuideMe and Glodium; all from Modrinth,
    // listed by hand.
    compileOnly("maven.modrinth:extendedae-plus:${project.eap_version}") {
        transitive = false
    }
    localRuntime("maven.modrinth:extendedae-plus:${project.eap_version}") {
        transitive = false
    }
    // ExtendedAE is also compiled against, for the sticky card (its storage buses) and the mixin on them.
    compileOnly("maven.modrinth:extended-ae:${project.extendedae_version}") {
        transitive = false
    }
    localRuntime("maven.modrinth:extended-ae:${project.extendedae_version}") {
        transitive = false
    }
    localRuntime("maven.modrinth:glodium:${project.glodium_version}") {
        transitive = false
    }
    localRuntime("maven.modrinth:guideme:${project.guideme_version}") {
        transitive = false
    }
    // Optional: GT circuit tags and Mekanism's circuit tags are merged (see CircuitTags). That is plain tag
    // data, so nothing is compiled against Mekanism; it's only in the dev runs for testing.
    localRuntime("mekanism:Mekanism:${project.minecraft_version}-${project.mekanism_version}") {
        transitive = false
    }
    // Block info overlay; GTCEu has its own Jade plugin (recipe progress, energy).
    localRuntime "maven.modrinth:jade:${project.jade_version}"
    // Optional: wireless networks are shared per FTB team when it is installed. We compile against
    // FTB Teams and Architectury (its events are Architectury Events) but never require them; the dev
    // runs include them, plus FTB Library, so teams can be tested.
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${project.ftbteams_version}") {
        transitive = false
    }
    compileOnly("dev.architectury:architectury-neoforge:${project.architectury_version}") {
        transitive = false
    }
    localRuntime("dev.ftb.mods:ftb-teams-neoforge:${project.ftbteams_version}") {
        transitive = false
    }
    localRuntime("dev.ftb.mods:ftb-library-neoforge:${project.ftblibrary_version}") {
        transitive = false
    }
    localRuntime("dev.architectury:architectury-neoforge:${project.architectury_version}") {
        transitive = false
    }

    // MixinExtras ships with NeoForge, nothing to add.
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def properties = [
        mod_license: project.mod_license,
        mod_id: project.mod_id,
        version: project.version,
        mod_name: project.mod_name,
        mod_url: project.mod_url,
        mod_author: project.mod_author,
        neoforge_version: project.neoforge_version.substring(0, project.neoforge_version.lastIndexOf('.')),
        minecraft_version: project.minecraft_version,
        gtceu_min_version: project.gtceu_min_version
    ]
    inputs.properties properties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    from('LICENSE')
    manifest {
        attributes([
            'Specification-Title': project.mod_id,
            'Specification-Vendor': project.mod_author,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': project.mod_author,
            'Implementation-Timestamp': System.currentTimeMillis().toString()
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

tasks.named('sourcesJar') {
    exclude { it.file.absolutePath.contains('generated') }
}
