plugins {
    id 'dev.architectury.loom' version '1.13.467'
    id 'maven-publish'
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

java {
    // Minecraft 1.20.1 / Forge 47 must run on Java 17, but Architectury Loom 1.13 requires the
    // Gradle JVM itself to be 21+. A toolchain keeps javac and the runClient/runServer launcher on 17.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDir 'src/generated/resources'
    }
}

loom {
    silentMojangMappingsLicense()

    // Adds a 'data' run (runData) with --all/--mod/--output filled in; --existing goes on the run below.
    forge {
        dataGen {
            mod project.mod_id
        }
        // Adds MixinConfigs to the jar manifest and passes the config to the dev runs.
        // gtmqol.recipedb.mixins.json is gated by RecipeDBMixinPlugin (config/gtmqol-early.properties).
        mixinConfig 'gtmqol.mixins.json', 'gtmqol.recipedb.mixins.json'
    }

    runs {
        client {
            programArgs '--width', '1280', '--height', '720'
            ideConfigGenerated true
            runDir 'run'
        }
        server {
            ideConfigGenerated true
            runDir 'run'
        }
        data {
            programArgs '--existing', file('src/main/resources').absolutePath
            programArgs '--existing-mod', 'gtceu'
            ideConfigGenerated true
        }
    }

    mods {
        gtmqol {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'GTCEu'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'brachy.modularui'
        }
    }
    maven {
        name = 'Parchment'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'LDLib'
        url = 'https://maven.firstdarkdev.xyz/snapshots/'
    }
    maven {
        name = 'tterrag'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
            includeGroup 'mekanism'
        }
    }
    maven {
        name = 'SAPS'
        url = 'https://maven.saps.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }
    maven {
        // Rhino (KubeJS's script engine) is only published here, not on SAPS
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'Toma'
        url = 'https://repo.repsy.io/mvn/toma/public/'
        content {
            includeGroup 'dev.toma.configuration'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content {
            includeGroup 'dev.ftb.mods'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    mappings loom.layered {
        // Named like Forge's own dev environment (e.g. `this$0`); mods' mixins shadow those names, and
        // with false Jade's StringRenderOutputMixin fails to apply in dev.
        officialMojangMappings {
            nameSyntheticMembers = true
        }
        parchment "org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_mappings}@zip"
    }

    // :slim is the same jar without the jar-in-jars, as used by GTCEu's official addon templates.
    modImplementation "com.gregtechceu.gtceu:gtceu-${project.minecraft_version}:${project.gtceu_version}:slim"

    // gtceu jar-in-jars everything it needs (see META-INF/jarjar/metadata.json in its full jar), so
    // players are fine. But its maven metadata lists no dependencies, and Loom drops the jarjar metadata
    // when remapping, so FML can't unpack them in dev. The same set is declared here explicitly instead.
    // Registrate also shows up in gtceu's public API (GTRegistrate, MachineBuilder), hence on compile.
    modImplementation "com.tterrag.registrate:Registrate:${project.registrate_version}"
    // Also our own config library (see GTMQoLConfig). Its pom leaks a dev-only forge coordinate
    // (1.20.1-47.3.0_mapped_official_1.20.1) that is not published anywhere, so take the jar alone.
    modImplementation("dev.toma.configuration:configuration-${project.minecraft_version}:${project.configuration_version}") {
        transitive = false
    }
    // Also on compile: machine UIs (IMuiMachine.buildMainUI) are built from ModularUI widgets.
    modImplementation "brachy.modularui:modularui-mc${project.minecraft_version}:${project.modularui_version}"
    // Second level of the same problem: ModularUI jar-in-jars EvalEx, which gtceu itself uses (PipeBlock)
    // but only declares compileOnly. It's a plain library, not a mod, so it goes through
    // forgeRuntimeLibrary to land on the module layer the mods can see.
    runtimeOnly(forgeRuntimeLibrary("com.ezylang:EvalEx:${project.evalex_version}"))
    // ModularUI registers test items when !FMLLoader.isProduction(), one of which implements a Curios
    // interface, so every dev run needs Curios. gtceu's own dev setup has it as modLocalRuntime too.
    modLocalRuntime "top.theillusivec4.curios:curios-forge:${project.curios_version}"

    // Dev-only mods so the test client has recipe viewing, ME networks and KubeJS (GTCEu's optional deps).
    modLocalRuntime "mezz.jei:jei-${project.minecraft_version}-forge:${project.jei_version}"
    modLocalRuntime "dev.latvian.mods:kubejs-forge:${project.kubejs_version}"
    // Compile-only for KubeJSDataGenFix; still not a runtime dependency of ours.
    modCompileOnly "dev.latvian.mods:kubejs-forge:${project.kubejs_version}"
    modLocalRuntime "appeng:appliedenergistics2-forge:${project.ae2_version}"
    // Compile-only for recipedb/PatternBufferIngredients (gtceu's pattern buffer implements AE2 interfaces);
    // only used when AE2 is loaded, still not a runtime dependency of ours.
    modCompileOnly "appeng:appliedenergistics2-forge:${project.ae2_version}"
    // Optional: GT circuit tags and Mekanism's forge:circuits/* tags are merged (see CircuitTags). That is
    // plain tag data, so nothing is compiled against Mekanism; it's only in the dev runs for testing.
    modLocalRuntime("mekanism:Mekanism:${project.minecraft_version}-${project.mekanism_version}") {
        transitive = false
    }
    // Block info overlay; GTCEu has its own Jade plugin (recipe progress, energy).
    modLocalRuntime "maven.modrinth:jade:${project.jade_version}"
    // Optional: wireless networks are shared per FTB team when it is installed. We compile against
    // FTB Teams and Architectury (its events are Architectury Events) but never require them; the dev
    // runs include them, plus FTB Library, so teams can be tested. Dependencies are listed by hand
    // because the poms pin older versions of each other.
    modCompileOnly("dev.ftb.mods:ftb-teams-forge:${project.ftbteams_version}") {
        transitive = false
    }
    modCompileOnly("dev.architectury:architectury-forge:${project.architectury_version}") {
        transitive = false
    }
    modLocalRuntime("dev.ftb.mods:ftb-teams-forge:${project.ftbteams_version}") {
        transitive = false
    }
    modLocalRuntime("dev.ftb.mods:ftb-library-forge:${project.ftblibrary_version}") {
        transitive = false
    }
    modLocalRuntime("dev.architectury:architectury-forge:${project.architectury_version}") {
        transitive = false
    }

    // gtceu's mixins use @WrapOperation and need MixinExtras. Ship it jar-in-jar in our own mod so
    // neither the dev runs nor players have to install it separately. Setup per the MixinExtras wiki
    // (Forge + Architectury Loom): common on the classpath, forge jar on the classpath and included.
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"))
    implementation(include("io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}"))
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def properties = [
        mod_license: project.mod_license,
        mod_id: project.mod_id,
        version: project.version,
        mod_name: project.mod_name,
        mod_url: project.mod_url,
        mod_author: project.mod_author,
        forge_version: project.forge_version.split('\\.')[0],
        minecraft_version: project.minecraft_version,
        gtceu_min_version: project.gtceu_min_version
    ]
    inputs.properties properties

    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Loom's run tasks default to the Gradle JVM (21+), which Minecraft 1.20.1 cannot use.
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': project.mod_id,
            'Specification-Vendor': project.mod_author,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': project.mod_author,
            'Implementation-Timestamp': System.currentTimeMillis().toString()
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

tasks.named('sourcesJar') {
    exclude { it.file.absolutePath.contains('generated') }
}
