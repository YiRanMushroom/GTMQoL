plugins {
    id 'dev.architectury.loom' version '1.13.467'
    id 'maven-publish'
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

java {
    // Minecraft 1.20.1 / Forge 47 must run on Java 17, but Architectury Loom 1.13 requires the
    // Gradle JVM itself to be 21+. A toolchain keeps javac and the runClient/runServer launcher on 17.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
    }
}

loom {
    silentMojangMappingsLicense()

    runs {
        client {
            programArgs '--width', '1280', '--height', '720'
            ideConfigGenerated true
            runDir 'run'
        }
        server {
            ideConfigGenerated true
            runDir 'run'
        }
    }

    mods {
        gtmqol {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'GTCEu'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name = 'Parchment'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'LDLib'
        url = 'https://maven.firstdarkdev.xyz/snapshots/'
    }
    maven {
        name = 'tterrag'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        name = 'Toma'
        url = 'https://repo.repsy.io/mvn/toma/public/'
        content {
            includeGroup 'dev.toma.configuration'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    mappings loom.layered {
        officialMojangMappings {
            nameSyntheticMembers = false
        }
        parchment "org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_mappings}@zip"
    }

    modImplementation "com.gregtechceu.gtceu:gtceu-${project.minecraft_version}:${project.gtceu_version}"

    // GTCEu publishes no transitive dependencies, but its public API (GTRegistrate, MachineBuilder,
    // GTBlockstateProvider) exposes Registrate types. GTCEu jar-in-jars Registrate at runtime.
    modCompileOnly "com.tterrag.registrate:Registrate:${project.registrate_version}"

    // gtceu declares this mandatory and jar-in-jars it, but Loom does not unpack a dependency's
    // nested jars, so the dev client needs it on the mod classpath explicitly.
    // Its pom leaks a dev-only forge coordinate (1.20.1-47.3.0_mapped_official_1.20.1) that is not
    // published anywhere, so take the jar alone.
    modRuntimeOnly("dev.toma.configuration:configuration-${project.minecraft_version}:${project.configuration_version}") {
        transitive = false
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def properties = [
        mod_license: project.mod_license,
        mod_id: project.mod_id,
        version: project.version,
        mod_name: project.mod_name,
        mod_url: project.mod_url,
        mod_author: project.mod_author,
        forge_version: project.forge_version.split('\\.')[0],
        minecraft_version: project.minecraft_version,
        gtceu_version: project.gtceu_version
    ]
    inputs.properties properties

    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Loom's run tasks default to the Gradle JVM (21+), which Minecraft 1.20.1 cannot use.
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': project.mod_id,
            'Specification-Vendor': project.mod_author,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': project.mod_author,
            'Implementation-Timestamp': System.currentTimeMillis().toString()
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

tasks.named('sourcesJar') {
    exclude { it.file.absolutePath.contains('generated') }
}
