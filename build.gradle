plugins {
    id 'java-library'
    id 'maven-publish'
    // legacyForge mode of ModDevGradle: 1.20.1 Forge, same plugin gtceu's 1.20.1 branch uses (it has no Loom).
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
    // Applies META-INF/accesstransformer.cfg to modCompileOnly dependencies (accessModCompileOnly), compile time only.
    id 'dev.vfyjxf.modaccessor' version '1.2.1'
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

// Jar names: gtmqol-<mod version>-<mc version>.jar. project.version stays plain, it goes into mods.toml.
tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.mod_version}-${project.minecraft_version}"
}

java {
    // Minecraft 1.20.1 / Forge 47 runs on Java 17; the toolchain keeps javac and the run tasks on it.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
    }
}

legacyForge {
    version = "${project.minecraft_version}-${project.forge_version}"

    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = project.parchment_mappings
    }

    runs {
        client {
            client()
            programArguments.addAll('--width', '1280', '--height', '720')
            gameDirectory = file('run')
        }
        server {
            server()
            gameDirectory = file('run')
        }
        data {
            data()
            gameDirectory = file('run/data')
            programArguments.addAll('--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath,
                    '--existing-mod', 'gtceu')
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Adds MixinConfigs to the jar manifest and passes the configs to the dev runs, and wires the refmap.
// gtmqol.recipedb.mixins.json is gated by RecipeDBMixinPlugin (config/gtmqol-early.properties),
// gtmqol.eap.mixins.json by EAPMixinPlugin (only with ExtendedAE Plus installed),
// gtmqol.ae2.mixins.json by AE2MixinPlugin (only with AE2 installed; early config switches per feature).
mixin {
    add sourceSets.main, 'gtmqol.refmap.json'
    config 'gtmqol.mixins.json'
    config 'gtmqol.recipedb.mixins.json'
    config 'gtmqol.eap.mixins.json'
    config 'gtmqol.ae2.mixins.json'
}

// Our AT is for other mods' private classes (see META-INF/accesstransformer.cfg). ModDevGradle only applies it to
// Minecraft, so ModAccessor patches the jars on accessModCompileOnly for javac; at runtime Forge applies the AT.
modAccessor {
    createTransformConfiguration(configurations.modCompileOnly)
    accessTransformerFiles = project.files('src/main/resources/META-INF/accesstransformer.cfg')
}

configurations {
    // Mods only in the dev runs, never a dependency of ours; obfuscation below adds the remapped modLocalRuntime.
    runtimeClasspath.extendsFrom localRuntime
    implementation.extendsFrom modImplementation
}

obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/maven'
        content {
            includeGroup 'org.spongepowered'
        }
    }
    maven {
        name = 'GTCEu'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'brachy.modularui'
        }
    }
    maven {
        name = 'Parchment'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'LDLib'
        url = 'https://maven.firstdarkdev.xyz/snapshots/'
    }
    maven {
        name = 'tterrag'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
        content {
            includeGroup 'dev.emi'
        }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
            includeGroup 'mekanism'
        }
    }
    maven {
        name = 'SAPS'
        url = 'https://maven.saps.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }
    maven {
        // Rhino (KubeJS's script engine) is only published here, not on SAPS
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'Toma'
        url = 'https://repo.repsy.io/mvn/toma/public/'
        content {
            includeGroup 'dev.toma.configuration'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content {
            includeGroup 'dev.ftb.mods'
        }
    }
}

dependencies {
    // :slim is the same jar without the jar-in-jars, as used by GTCEu's official addon templates.
    modImplementation "com.gregtechceu.gtceu:gtceu-${project.minecraft_version}:${project.gtceu_version}:slim"

    // gtceu jar-in-jars everything it needs (see META-INF/jarjar/metadata.json in its full jar), so
    // players are fine. But its maven metadata lists no dependencies, so Gradle doesn't fetch them for dev.
    // The same set is declared here explicitly.
    // Registrate also shows up in gtceu's public API (GTRegistrate, MachineBuilder), hence on compile.
    modImplementation "com.tterrag.registrate:Registrate:${project.registrate_version}"
    // Also our own config library (see GTMQoLConfig). Its pom leaks a dev-only forge coordinate
    // (1.20.1-47.3.0_mapped_official_1.20.1) that is not published anywhere, so take the jar alone.
    modImplementation("dev.toma.configuration:configuration-${project.minecraft_version}:${project.configuration_version}") {
        transitive = false
    }
    // Also on compile: machine UIs (IMuiMachine.buildMainUI) are built from ModularUI widgets.
    modImplementation "brachy.modularui:modularui-mc${project.minecraft_version}:${project.modularui_version}"
    // Second level of the same problem: ModularUI jar-in-jars EvalEx, which gtceu itself uses (PipeBlock)
    // but only declares compileOnly. It's a plain library, not a mod, so it goes through
    // the runtime classpath (MDG puts it on the module layer the mods can see).
    runtimeOnly "com.ezylang:EvalEx:${project.evalex_version}"
    // ModularUI registers test items when !FMLLoader.isProduction(), one of which implements a Curios
    // interface, so every dev run needs Curios. gtceu's own dev setup has it as modLocalRuntime too.
    modLocalRuntime "top.theillusivec4.curios:curios-forge:${project.curios_version}"

    // Compile-only: FluidConfigWidget takes EMI stacks as drag-and-drop ingredients (only when EMI is loaded).
    modCompileOnly "dev.emi:emi-forge:${project.emi_version}"

    // Dev-only mods so the test client has recipe viewing, ME networks and KubeJS (GTCEu's optional deps).
    modLocalRuntime "mezz.jei:jei-${project.minecraft_version}-forge:${project.jei_version}"
    modLocalRuntime "dev.latvian.mods:kubejs-forge:${project.kubejs_version}"
    // KubeJS requires the rhino mod (>= 2001.2.2-build.1). Loom pulled it in transitively; the remapping configuration
    // of ModDevGradle does not, so it is listed by hand (Latvian maven).
    modLocalRuntime "dev.latvian.mods:rhino-forge:${project.rhino_version}"
    // Compile-only for KubeJSDataGenFix; still not a runtime dependency of ours.
    modCompileOnly "dev.latvian.mods:kubejs-forge:${project.kubejs_version}"
    modLocalRuntime "appeng:appliedenergistics2-forge:${project.ae2_version}"
    // Compile-only for recipedb/PatternBufferIngredients (gtceu's pattern buffer implements AE2 interfaces);
    // only used when AE2 is loaded, still not a runtime dependency of ours.
    accessModCompileOnly "appeng:appliedenergistics2-forge:${project.ae2_version}"
    // Optional: ExtendedAE Plus smart doubling on gtceu's pattern buffer. Compile against its API, never
    // require it. Its mods.toml requires ExtendedAE, which in turn requires GuideMe and Glodium; all from
    // Modrinth, listed by hand.
    modCompileOnly("maven.modrinth:extendedae-plus:${project.eap_version}") {
        transitive = false
    }
    modLocalRuntime("maven.modrinth:extendedae-plus:${project.eap_version}") {
        transitive = false
    }
    // ExtendedAE is also compiled against, for the sticky card (its storage buses) and the mixin on them.
    modCompileOnly("maven.modrinth:extended-ae:${project.extendedae_version}") {
        transitive = false
    }
    modLocalRuntime("maven.modrinth:extended-ae:${project.extendedae_version}") {
        transitive = false
    }
    modLocalRuntime("maven.modrinth:glodium:${project.glodium_version}") {
        transitive = false
    }
    modLocalRuntime("maven.modrinth:guideme:${project.guideme_version}") {
        transitive = false
    }
    // Optional: GT circuit tags and Mekanism's forge:circuits/* tags are merged (see CircuitTags). That is
    // plain tag data, so nothing is compiled against Mekanism; it's only in the dev runs for testing.
    modLocalRuntime("mekanism:Mekanism:${project.minecraft_version}-${project.mekanism_version}") {
        transitive = false
    }
    // Block info overlay; GTCEu has its own Jade plugin (recipe progress, energy).
    modLocalRuntime "maven.modrinth:jade:${project.jade_version}"
    // Optional: wireless networks are shared per FTB team when it is installed. We compile against
    // FTB Teams and Architectury (its events are Architectury Events) but never require them; the dev
    // runs include them, plus FTB Library, so teams can be tested. Dependencies are listed by hand
    // because the poms pin older versions of each other.
    modCompileOnly("dev.ftb.mods:ftb-teams-forge:${project.ftbteams_version}") {
        transitive = false
    }
    modCompileOnly("dev.architectury:architectury-forge:${project.architectury_version}") {
        transitive = false
    }
    modLocalRuntime("dev.ftb.mods:ftb-teams-forge:${project.ftbteams_version}") {
        transitive = false
    }
    modLocalRuntime("dev.ftb.mods:ftb-library-forge:${project.ftblibrary_version}") {
        transitive = false
    }
    modLocalRuntime("dev.architectury:architectury-forge:${project.architectury_version}") {
        transitive = false
    }

    // gtceu's mixins use @WrapOperation and need MixinExtras. Same as gtceu's 1.20.1 build: common as annotation
    // processor and compile dependency, forge jar jar-in-jar'd into our own mod.
    annotationProcessor "org.spongepowered:mixin:${project.mixin_version}:processor"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"))
    implementation "io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}"
    jarJar("io.github.llamalad7:mixinextras-forge:[${project.mixinextras_version},)")
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def properties = [
        mod_license: project.mod_license,
        mod_id: project.mod_id,
        version: project.version,
        mod_name: project.mod_name,
        mod_url: project.mod_url,
        mod_author: project.mod_author,
        forge_version: project.forge_version.split('\\.')[0],
        minecraft_version: project.minecraft_version,
        gtceu_min_version: project.gtceu_min_version
    ]
    inputs.properties properties

    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Same as gtceu: the plain jar is the dev one, reobfJar produces the real one.
jar.archiveClassifier = 'dev'
afterEvaluate {
    reobfJar.archiveClassifier = ''
}

jar {
    from('LICENSE')
    manifest {
        attributes([
            'Specification-Title': project.mod_id,
            'Specification-Vendor': project.mod_author,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': project.mod_author,
            'Implementation-Timestamp': System.currentTimeMillis().toString()
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

tasks.named('sourcesJar') {
    exclude { it.file.absolutePath.contains('generated') }
}
