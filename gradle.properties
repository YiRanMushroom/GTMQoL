# Mod Properties
mod_version=2.0.0
maven_group=com.yiran.minecraft
archives_base_name=gtmqol
mod_id=gtmqol
mod_name=GTM Quality of Life
mod_license=LGPL-3.0
mod_url=https://github.com/YiRanMushroom/GTMQoL
mod_author=Yiran, Frosty

# Minecraft & NeoForge (same as gtceu's 1.21 branch, gradle/libs.versions.toml)
minecraft_version=1.21.1
neoforge_version=21.1.248
parchment_minecraft_version=1.21.1
parchment_mappings=2024.11.17

# Dependencies
# Pinned snapshot build (maven coordinate); bump by hand from maven.gtceu.com .../gtceu-1.21.1/8.0.0-SNAPSHOT/maven-metadata.xml
gtceu_version=8.0.0-20261001.095212-101
# Lower bound for neoforge.mods.toml. gtceu reports itself as 8.0.0-SNAPSHOT+<commit> at runtime, which sorts
# below the timestamped coordinate above, so the two can't share one value.
gtceu_min_version=8.0.0-SNAPSHOT
# gtceu's jar-in-jars (gradle/forge.versions.toml on gtceu's 1.21 branch)
registrate_version=MC1.21-1.3.0+67
configuration_version=3.1.1-neoforge
# Must match the mui version gtceu was built against: gtceu uses 3.3.1-SNAPSHOT, pinned to the build current
# when the gtceu snapshot above was published.
modularui_version=3.3.1-20260922.143646-5
curios_version=9.4.2+1.21.1
# Optional: compile only, plus dev runtime
ftbteams_version=2101.1.11
ftblibrary_version=2101.1.30
architectury_version=13.0.8
# ExtendedAE Plus (smart doubling) and what it needs at dev runtime, from Modrinth
# Modrinth version id of the NeoForge 1.6.3 build: the Forge build has the same version number, and
# resolving by number picked the Forge jar.
# Look up ids at api.modrinth.com/v2/project/extendedae-plus/version (AtuOmKkV = 1.6.3).
eap_version=AtuOmKkV
extendedae_version=1.21-2.2.35-neoforge
glodium_version=1.21-2.2-neoforge
guideme_version=21.1.19
# Mystical Agriculture (greenhouse recipes from its crop registry) and Cucumber, which it requires.
# Modrinth version ids: PLakgT6X = MA 1.21.1-8.0.28, 8421rqFF = Cucumber 1.21.1-8.0.16.
mysticalagriculture_version=PLakgT6X
cucumber_version=8421rqFF
# Modern Industrialization (gregification). Modrinth version id: HOR1tVas = 2.5.10. Its GrandPower is jar-in-jar,
# guideme is above.
mi_version=HOR1tVas
# Applied Mekanistics (chemicals in AE: MekanismKey). Modrinth version id: TpUCzFaW = 1.6.3, mod id appmek.
appmek_version=TpUCzFaW

# Dev-only runtime mods (localRuntime), for in-game testing
# emi: gtceu's 1.21 dev runtime uses EMI (JEI is commented out there). With JEI, this gtceu snapshot
# crashes in GTRecipeCategories.<clinit>: CategoryIcon asks GTJEIPlugin.getRuntime() during mod construction.
emi_version=1.1.24+1.21.1
kubejs_version=2101.7.2-build.336
# ae2: gtceu builds against 19.2.8, but EAP 1.6.3 mixes into AEBaseMenu.clicked, which 19.2.8 doesn't have
ae2_version=19.2.18
jade_version=15.10.6+neoforge
mekanism_version=10.7.19.85
# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.fromEnv=JDK21
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
