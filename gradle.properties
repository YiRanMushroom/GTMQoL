# Mod Properties
mod_version=2.0.0
maven_group=com.yiran.minecraft
archives_base_name=gtmqol
mod_id=gtmqol
mod_name=GTM Quality of Life
mod_license=LGPL-3.0
mod_url=https://github.com/YiRanMushroom/GTMQoL
mod_author=Yiran, Frosty

# Minecraft & Forge
minecraft_version=1.20.1
forge_version=47.4.1

# Mappings
parchment_mappings=2023.09.03

# Dependencies
# Pinned snapshot build (maven coordinate); bump by hand from maven.gtceu.com .../8.0.0-SNAPSHOT/maven-metadata.xml
gtceu_version=8.0.0-20260926.222216-292
# Lower bound for mods.toml. gtceu reports itself as 8.0.0-SNAPSHOT+<commit> at runtime, which sorts
# below the timestamped coordinate above, so the two can't share one value.
gtceu_min_version=8.0.0-SNAPSHOT
registrate_version=MC1.20-1.3.11
configuration_version=3.1.0-forge
mixinextras_version=0.5.5
# Annotation processor for the refmap (legacyForge); same as gtceu's 1.20.1 build.
mixin_version=0.8.7
# Must match the mui version gtceu was built against (gradle/forge.versions.toml at gtceu's commit).
# gtceu uses 3.3.1-SNAPSHOT, whose API differs from the 3.3.1 release (ModularPanel.onCloseAction).
modularui_version=3.3.1-20260913.083747-19
curios_version=5.9.1+1.20.1
evalex_version=3.6.0
# Optional: compile only, plus dev runtime
ftbteams_version=2001.3.0
ftblibrary_version=2001.2.4
architectury_version=9.1.12
# ExtendedAE Plus (smart doubling) and what it needs at dev runtime, from Modrinth
# 1.6.1-f1+ declares an optional jei >= 15.48.0.177 (Forge checks it whenever jei is present), but gtceu's
# jei mixins (FluidHelperMixin) don't apply on jei that new. 1.6.1 is the last version without that range.
eap_version=1.6.1
extendedae_version=1.20-1.4.18-forge
glodium_version=1.20-1.5-forge
guideme_version=20.1.14
# Mystical Agriculture (greenhouse recipes from its crop registry) and Cucumber, which it requires.
# Modrinth version ids: EEilTecF = MA 1.20.1-7.0.24, xnLznSfT = Cucumber 1.20.1-7.0.16.
mysticalagriculture_version=EEilTecF
cucumber_version=xnLznSfT

# emi: compile only, same version as gtceu's 1.20.1 build
emi_version=1.1.24+1.20.1

# Dev-only runtime mods (modLocalRuntime), for in-game testing
# jei: same as gtceu's build; its jei mixins fail on newer versions (see eap_version)
jei_version=15.20.0.115
rhino_version=2001.2.2-build.17
kubejs_version=2001.6.5-build.26
# ae2: EAP needs >= 15.4.10; same as gtceu's own build
ae2_version=15.4.10
jade_version=11.13.3+forge
mekanism_version=10.4.16.80
# Applied Mekanistics (chemicals in AE: MekanismKey). Modrinth version id: 9n9p68Qq = 1.4.3, mod id appmek.
appmek_version=9n9p68Qq
# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.fromEnv=JDK17
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
